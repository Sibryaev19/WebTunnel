# Имитация прокси JupyterHub (как jupyter-server-proxy) для локальных тестов.
#
# Nginx слушает 8080 и проксирует путь /user/my_login/proxy/8000/ на FastAPI
# (localhost:8000 хоста), ОТРЕЗАЯ префикс — ровно так же поступает реальный
# JupyterHub. Префикс должен совпадать с BASE_PATH в config.txt:
#     BASE_PATH=/user/my_login/proxy/8000
# Если поменяете префикс здесь — поменяйте его и в config.txt.

# Корректный заголовок Connection для WebSocket-апгрейда
# (и обычных запросов без Upgrade)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # /user/my_login/proxy/8000 без хвостового слэша -> 301 на вариант со слэшем
    location = /user/my_login/proxy/8000 {
        return 301 /user/my_login/proxy/8000/;
    }

    location /user/my_login/proxy/8000/ {
        # Завершающий "/" в proxy_pass заставляет nginx отрезать префикс location
        proxy_pass http://127.0.0.1:8000/;

        # Хост браузера (с портом!) — чтобы прокси строил ссылки вида
        # http://localhost:8080/user/my_login/proxy/8000/...
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Стриминг / long-poll / SSE: без буферизации, с длинными таймаутами
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 0;
    }
}
