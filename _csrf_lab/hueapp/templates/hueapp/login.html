<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Sign in - Hue (pseudo)</title></head>
<body>
  <h1>Hue (pseudo) — Sign in</h1>
  {% if form.errors %}<p style="color:red">Неверный логин или пароль.</p>{% endif %}
  <form method="post" action="">
    {% csrf_token %}
    <label>Username: <input type="text" name="username"></label><br>
    <label>Password: <input type="password" name="password"></label><br>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
